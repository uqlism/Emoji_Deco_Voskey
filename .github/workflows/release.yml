name: Daily Build & Release

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 00:00 UTC (09:00 JST)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run src/index.ts

      - name: Update release
        run: |
          gh release create latest \
            --title "Latest Build" \
            --notes "Vosky 絵文字パック - 毎日自動更新" \
            2>/dev/null || true
          gh release upload latest output.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Daily Build & Release

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 00:00 UTC (09:00 JST)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run src/index.ts
        env:
          OUT_ZIP: emoji_deco_voskey_1.20.1-0.3.0.zip

      - name: Update release
        run: |
          gh release create latest \
            --title "Latest Build" \
            --notes "Vosky 絵文字パック - 毎日自動更新" \
            2>/dev/null || true
          gh release upload latest emoji_deco_voskey_1.20.1-0.3.0.zip --clobber \
            || gh release create latest emoji_deco_voskey_1.20.1-0.3.0.zip \
                --title "Latest Build" \
                --notes "Vosky 絵文字パック - 毎日自動更新"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
